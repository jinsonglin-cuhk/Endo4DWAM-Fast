# EndoWAM endoscope dataset (pseudo-action OBB, z60, rot45 augmented) for Endo4DWAM.
#
# Single camera (observation.images.endoscope), 3-DoF discrete pseudo-action
# (m2/m3/m4 target rpm, values in {-1,0,1}, already in [-1,1]).
# State == previous-step action, also 3-D.
#
# Layout: 3 procedures x 8 rotation angles = 24 LeRobot-v2.1 roots, merged via
# MultiLeRobotDataset (dataset_dirs accepts a list).
#
# IMPORTANT (do these before training):
#   1. Generate meta/episodes_stats.jsonl for every root (Endo4DWAM's LeRobot
#      loader requires it on v2.1; EndoWAM only ships stats_gr00t.json):
#        python scripts/build_endowam_episodes_stats.py \
#          --data_root /mnt/data2/ljs/EndoWAM/dataset/endowam_pseudo_z60_rot45
#   2. Precompute T5 text-embedding cache (see task config).
#
# Notes on the careful bits (input/output + normalization):
#   - action_output_dim / proprio_output_dim = 3 (the model picks these up via
#     ${...} interpolation in configs/model/endo4dwam*.yaml, so the model config
#     itself needs NO changes).
#   - delta_action_dim_mask: [false, false, false] — the actions are discrete
#     direction commands, NOT end-effector poses. They must NOT be differenced.
#   - norm_default_mode: min/max — maps the already-[-1,1] action/state to
#     [-1,1] (near-identity); avoids z-score blowing up the discrete values.
#   - video 270x360 (HxW) -> [256, 320] (near 4:3, no distortion) and
#     is divisible by 32 for the Wan2.2 VAE (16x, patchify 2x + encoder 8x) + DiT patch (2x).
#     NOTE: WanVideoVAE38.upsampling_factor=16, NOT 8; video dims must be divisible by 32.

train:
  _target_: endo4dwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - /mnt/data2/ljs/EndoWAM/dataset/endowam_pseudo_z60_rot45/ercp/rot000
    - /mnt/data2/ljs/EndoWAM/dataset/endowam_pseudo_z60_rot45/ercp/rot045
    - /mnt/data2/ljs/EndoWAM/dataset/endowam_pseudo_z60_rot45/ercp/rot090
    - /mnt/data2/ljs/EndoWAM/dataset/endowam_pseudo_z60_rot45/ercp/rot135
    - /mnt/data2/ljs/EndoWAM/dataset/endowam_pseudo_z60_rot45/ercp/rot180
    - /mnt/data2/ljs/EndoWAM/dataset/endowam_pseudo_z60_rot45/ercp/rot225
    - /mnt/data2/ljs/EndoWAM/dataset/endowam_pseudo_z60_rot45/ercp/rot270
    - /mnt/data2/ljs/EndoWAM/dataset/endowam_pseudo_z60_rot45/ercp/rot315
    - /mnt/data2/ljs/EndoWAM/dataset/endowam_pseudo_z60_rot45/esophagus/rot000
    - /mnt/data2/ljs/EndoWAM/dataset/endowam_pseudo_z60_rot45/esophagus/rot045
    - /mnt/data2/ljs/EndoWAM/dataset/endowam_pseudo_z60_rot45/esophagus/rot090
    - /mnt/data2/ljs/EndoWAM/dataset/endowam_pseudo_z60_rot45/esophagus/rot135
    - /mnt/data2/ljs/EndoWAM/dataset/endowam_pseudo_z60_rot45/esophagus/rot180
    - /mnt/data2/ljs/EndoWAM/dataset/endowam_pseudo_z60_rot45/esophagus/rot225
    - /mnt/data2/ljs/EndoWAM/dataset/endowam_pseudo_z60_rot45/esophagus/rot270
    - /mnt/data2/ljs/EndoWAM/dataset/endowam_pseudo_z60_rot45/esophagus/rot315
    - /mnt/data2/ljs/EndoWAM/dataset/endowam_pseudo_z60_rot45/ureter/rot000
    - /mnt/data2/ljs/EndoWAM/dataset/endowam_pseudo_z60_rot45/ureter/rot045
    - /mnt/data2/ljs/EndoWAM/dataset/endowam_pseudo_z60_rot45/ureter/rot090
    - /mnt/data2/ljs/EndoWAM/dataset/endowam_pseudo_z60_rot45/ureter/rot135
    - /mnt/data2/ljs/EndoWAM/dataset/endowam_pseudo_z60_rot45/ureter/rot180
    - /mnt/data2/ljs/EndoWAM/dataset/endowam_pseudo_z60_rot45/ureter/rot225
    - /mnt/data2/ljs/EndoWAM/dataset/endowam_pseudo_z60_rot45/ureter/rot270
    - /mnt/data2/ljs/EndoWAM/dataset/endowam_pseudo_z60_rot45/ureter/rot315
  shape_meta:
    images:
      - key: endoscope          # -> observation.images.endoscope
        raw_shape: [3, 270, 360]
        shape: [3, 256, 320]
    action:
      - key: default            # -> action
        raw_shape: 3            # m2/m3/m4 target rpm, in {-1,0,1}
        shape: 3
    state:
      - key: default            # -> observation.state (== action[t-1])
        raw_shape: 3
        shape: 3
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 2    # match EndoWAM pipeline: 32 action steps, 17 video frames
                                # (constraints OK: (33-1)%2==0, (32//2)=16 %4==0; VAE temporal (17-1)%4==0)
                                # NOTE: 17 video frames ~= 2x the VAE/attn compute vs ratio=4 (9 frames).
                                #       If you OOM on a 5B DiT, set this back to 4.
  video_size: [256, 320]        # final video fed to VAE (HxW); must be divisible by 32 (VAE 16x + patch 2x)
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: true
  skip_padding_as_possible: false
  concat_multi_camera: "horizontal"   # single camera -> squeeze branch, value unused
  processor:
    _target_: endo4dwam.datasets.lerobot.processors.endo4dwam_processor.Endo4DWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 1
    action_output_dim: 3
    proprio_output_dim: 3
    delta_action_dim_mask:
      default: [false, false, false]   # discrete direction commands, never delta

    # action & state normalization
    action_state_transforms: null
    use_stepwise_action_norm: False
    norm_default_mode: min/max
    norm_exception_mode: null

    action_state_merger:
      _target_: endo4dwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign

    train_transforms:
      - _target_: endo4dwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [256, 320]
    val_transforms:
      - _target_: endo4dwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [256, 320]
  text_embedding_cache_dir: ./data/text_embeds_cache/endowam
  context_len: 128
