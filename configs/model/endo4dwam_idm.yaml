_target_: endo4dwam.runtime.create_endo4dwam_idm
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
redirect_common_files: true
mot_checkpoint_mixed_attn: true
action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
skip_dit_load_from_pretrain: false

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: "first_frame_causal" # default
  # Leading latent frames kept clean as history. K=1 reproduces the original
  # first-frame-only behaviour bit-for-bit. Measured pixel->latent grouping (P0):
  # lat0 <- pix0 alone, lat_j (j>=1) <- pix[4j-3..4j], so K=2 == 5 history pixel
  # frames. The standalone 17-frame default would leave 3 future latents.
  # NOTE: inference still conditions on one frame, so K>1 raises there for now.
  num_history_latent_frames: 1
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: "group_diagonal"

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

# Training-only geometry / motion readout (WAM4D-style spatial registers).
# Removed entirely at inference; `enable: false` is bit-identical to no branch.
# register_grid is the auxiliary DPT readout grid; grid * head.patch_size must
# equal data.video_size. It is independent of the denser DiT video-token grid.
# num_supervised_steps is the number of FUTURE latent steps = T_lat - K.
geometry:
  enable: false
  capture_layers: [12, 14, 16, 18]   # WAM4D Table 7: middle layers won
  geo_dim: 1024                      # EdGE readout adapts this to frame/global dim 2048
  num_heads: 8                       # 1024 / 8 = 128; the video expert's 24 does not divide 1024
  register_grid: [8, 10]             # 256x320 -> 8x10 cells of 32x32 px
  num_supervised_steps: 4            # T_lat 5 - K 1
  depth:
    enable: true
  motion:
    enable: true
  head:
    type: edge                               # IDM rejects geometry; kept for config parity
    source_path: ${oc.env:EDGE_SRC,/mnt/data2/ljs/Endo4DWAM/EdGE-review}
    weights_path: ${oc.env:EDGE_WEIGHTS,/mnt/data2/ljs/Endo4DWAM/EdGE-review/weights/model.safetensors}
    model_id: depth-anything/DA3MONO-LARGE   # used only when type=da3
    patch_size: 32                           # 8x10 tokens -> 256x320
    freeze: false

loss:
  lambda_action: 1.0
  # Geometry readout weights. Deliberately below WAM4D's lambda_depth=1: our depth is
  # an EdGE pseudo-label, our flow a RAFT pseudo-label and our action a
  # pseudo-action, so the raw loss scales are not the paper's. Start small and watch
  # the gradient-norm ratio on the shared history features, not the loss values.
  lambda_depth: 0.0
  lambda_flow: 0.0

lora:
  enable: false
  rank: 16
  alpha: 32
  dropout: 0.05
  train_base: false
  target_modules: "self_attn.q,self_attn.k,self_attn.v,self_attn.o,cross_attn.q,cross_attn.k,cross_attn.v,cross_attn.o,ffn.0,ffn.2"
