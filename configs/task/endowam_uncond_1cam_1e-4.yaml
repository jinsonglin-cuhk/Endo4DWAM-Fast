# @package _global_
#
# Endo4DWAM (uncond) baseline on the EndoWAM endoscope dataset.
# Uses the original configs/model/endo4dwam.yaml unchanged — action_dim (3) and
# proprio_dim (3) are pulled from the data config via ${...} interpolation.
#
# Workflow (run in order):
#   1. One-time: generate per-episode stats so the LeRobot loader accepts v2.1:
#        python scripts/build_endowam_episodes_stats.py \
#          --data_root /mnt/data2/ljs/Endo4DWAM/Endo4DWAM/dataset/endowam_pseudo_z60
#
#   2. Precompute the T5 text-embedding cache for this task's prompts:
#        python scripts/precompute_text_embeds.py task=endowam_uncond_1cam_1e-4
#      (multi-GPU: torchrun --standalone --nproc_per_node=8 scripts/precompute_text_embeds.py task=endowam_uncond_1cam_1e-4)
#
#   3. First training run leaves pretrained_norm_stats=null (in configs/data/endowam_endoscope.yaml),
#      which auto-generates runs/.../dataset_stats.json. Train:
#        bash scripts/train_zero1.sh 2 task=endowam_uncond_1cam_1e-4
#      (use the GPU count you have; EndoWAM pipeline used 2 GPUs.)

defaults:
  - override /data: endowam_endoscope
  - override /model: endo4dwam
  - _self_

# dataloading
batch_size: 4
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false
  lora:
    enable: true   # LoRA on video expert; rank/alpha/dropout/target_modules from model config defaults

# scheduler (aligned with EndoWAM train_endowam_causal_gaze_latent.sh)
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10            # ignored: max_steps below takes precedence (trainer.py:205)
max_steps: 40000          # = EndoWAM trainer.max_train_steps
log_every: 10
save_every: 1000          # = EndoWAM trainer.save_interval
eval_every: 500           # = EndoWAM trainer.eval_interval

# training
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
save_total_limit: 1   # keep only the latest checkpoint, matching EndoWAM save_total_limit=1

# Video LoRA is enabled above; save_total_limit rotates both weights and state.
# Text encoder and VAE are frozen.
